services:
  mirofish-neo4j:
    image: neo4j:5.18
    container_name: mirofish-neo4j
    environment:
      - NEO4J_AUTH=neo4j/mirofish
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "mirofish", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  mirofish:
    build: .
    container_name: mirofish-offline
    depends_on:
      mirofish-neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://mirofish-neo4j:7687
    ports:
      - "3010:3000"   # Vue frontend
      - "5003:5010"   # Flask backend
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  neo4j_data:
